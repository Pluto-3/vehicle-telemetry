services:
  db:
    image: postgres:18.3
    container_name: telemetry_postgres
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry
    volumes:
      - telemetry_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: telemetry_redis
    ports:
      - "6380:6379"

volumes:
  telemetry_pgdata:
